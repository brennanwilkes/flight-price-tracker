# Dashboard to GitHub Pages. Deploys only when frontend/ changes: the page reads its data live
# from the data branch (raw.githubusercontent.com), so new sweeps need no deploy.
name: Deploy Pages

on:
  push:
    branches: [main]
    paths: ['frontend/**', 'scripts/stamp-pwa.mjs', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Copy, then stamp the copy: the build hash goes into sw.js and index.html (never committed).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cp -r frontend _site && node scripts/stamp-pwa.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
