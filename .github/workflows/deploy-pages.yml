# Dashboard to GitHub Pages: on a frontend/ change, and after each sweep's build (it uploads
# derived/ to the release derived-latest and dispatches this workflow). The site carries those
# files under ./data/; state/ (health, alerts) is still read from the data branch.
name: Deploy Pages

on:
  push:
    branches: [main]
    paths: ['frontend/**', 'scripts/stamp-pwa.mjs', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Copy, then stamp the copy: the build hash goes into sw.js and index.html (never committed).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cp -r frontend _site && node scripts/stamp-pwa.mjs _site
      # The sweep's derived/ files, same-origin beside the frontend (a browser can't fetch a Release
      # asset: the download 302s to a host without CORS). The release derived-latest, which the
      # sweep's build uploads and then dispatches this workflow; until the first upload, the data
      # branch's derived/. Fails the deploy if neither has it: the last good site stays live.
      - name: Derived files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/data dl
          if gh release download derived-latest -p derived.tar.gz -D dl && gzip -t dl/derived.tar.gz; then
            tar -xzf dl/derived.tar.gz -C _site/data
            echo "derived/ from release derived-latest"
          else
            echo "no release yet: derived/ from the data branch"
            git fetch -q --depth 1 origin data
            git archive origin/data derived | tar -x -C _site/data
          fi
          test -s _site/data/derived/trips-YVR.json || { echo "derived/trips-YVR.json missing: not deploying"; exit 1; }
          du -sh _site/data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # Twice on Nov 24 the deploy found no artifact a few seconds after its upload (GitHub's side;
      # a rerun deployed it): once more after a minute.
      - id: first
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.first.outcome == 'failure'
        run: sleep 60
      - id: retry
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - id: deployment
        run: echo "page_url=${{ steps.first.outputs.page_url || steps.retry.outputs.page_url }}" >> "$GITHUB_OUTPUT"
