# Probe: does the search page take a departure-time window in its tfs? Manual dispatch only.
name: Probe time windows

on:
  workflow_dispatch:
    inputs:
      search:
        description: From, to, date
        default: YVR ICN 2026-12-10
      empty:
        description: Searches that inlined nothing (FROM-TO-CABIN-date[-ret]); empty skips the time probe
        default: ''
      spa:
        description: One page, several searches (FROM TO DATE N); empty skips
        default: ''
      quick:
        description: Only the plain search for each (1 = yes)
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scraper/package-lock.json
      - name: Install
        working-directory: scraper
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: VPN up
        env:
          WG_CONF: ${{ secrets.PROTONVPN_WG_CONF }}
        run: |
          scripts/vpn_up.sh
          grep -q '^vpn_ok=true' "$GITHUB_OUTPUT" || { echo "::error::VPN did not come up"; exit 1; }
      - name: Probe one page
        if: inputs.spa != ''
        run: node scraper/bin/probe-spa.js ${{ inputs.spa }}
      - name: Probe
        if: inputs.empty == '' && inputs.spa == ''
        run: node scraper/bin/probe-times.js ${{ inputs.search }} --browser
      - name: Probe empty pages
        if: inputs.empty != ''
        env:
          QUICK: ${{ inputs.quick }}
        run: node scraper/bin/probe-empty.js ${{ inputs.empty }}
