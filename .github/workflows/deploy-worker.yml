# Deploy the Cloudflare Worker (personal account) on changes under worker/. Everything in prod is
# made here, never by hand: the KV namespace (created if absent), the Worker, and its secrets
# (re-pushed every deploy, so the GitHub secret store stays the single source of truth).
#
# GitHub secrets: CLOUDFLARE_API_TOKEN (scoped to the personal account), CLOUDFLARE_ACCOUNT_ID,
# NOTIFY_SECRET, VAPID_PRIVATE_KEY, GH_DISPATCH_TOKEN.
name: Deploy Worker

on:
  push:
    branches: [main]
    paths: [worker/**, .github/workflows/deploy-worker.yml]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run typecheck
      - run: npm test
      - name: Bundle check (no deploy)
        run: npx wrangler deploy --dry-run --outdir /tmp/dist

  deploy:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --no-fund --no-audit

      - name: Ensure KV namespace
        run: node scripts/ensure-kv.mjs

      - name: Deploy
        run: npx wrangler deploy

      # printf, not echo: VAPID_PRIVATE_KEY is parsed as a JWK `d`, where a trailing newline
      # makes an invalid key. Same for the others, for consistency.
      - name: Set NOTIFY_SECRET
        run: printf '%s' "${{ secrets.NOTIFY_SECRET }}" | npx wrangler secret put NOTIFY_SECRET
      - name: Set VAPID_PRIVATE_KEY
        run: printf '%s' "${{ secrets.VAPID_PRIVATE_KEY }}" | npx wrangler secret put VAPID_PRIVATE_KEY
      - name: Set GH_DISPATCH_TOKEN
        run: printf '%s' "${{ secrets.GH_DISPATCH_TOKEN }}" | npx wrangler secret put GH_DISPATCH_TOKEN

      # Each secret put rolls out a new version; give it a few tries.
      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://flight-fare-tracker.brennan-a53.workers.dev/health && curl -fsS https://flight-fare-tracker.brennan-a53.workers.dev/vapid | grep -q '"publicKey":"B'; then exit 0; fi
            sleep 10
          done
          exit 1
