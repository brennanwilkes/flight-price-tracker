# Long-leg price sweep into the `data` branch. Egress: ProtonVPN first (M1: the runner's own IP
# gets soft-blocked under load), the direct IP only if the tunnel won't come up.
#
# Clock: the Cloudflare Worker cron dispatches this hourly (what each run scrapes: sweep/plan.js), and
# its POST /sweep for a full sweep on demand. No GitHub `schedule:` (it runs late and skips).
name: Sweep

on:
  workflow_dispatch:
    inputs:
      routes:
        description: Only these O-D routes (comma-separated, e.g. YVR-ICN); empty = all
        default: ''

permissions:
  contents: write  # push to the data branch
  actions: read  # gh cache list (Search cache worth saving)

concurrency:
  group: sweep
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 58  # scrape budget 25, then the build until BUILD_DEADLINE; the next hourly run queues
    env:
      # Trip planning holds every candidate trip (2.7 GB at 26 departure days, growing with each
      # day Google opens); Node's default cap is ~4 GB of the runner's 16.
      NODE_OPTIONS: --max-old-space-size=11264
      # Real Chrome (the runner image has it), not Playwright's bundled Chromium: only a real Chrome
      # that doesn't say it's automated is shown every seller's price (2026-11-11: Trip.com $2,785
      # vs $4,612 on the same booking page; browser.js openBrowser, gflights/booking.js).
      PW_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scraper/package-lock.json

      - name: Install
        working-directory: scraper
        run: |
          npm ci --no-audit --no-fund
          # The image's Chrome is what runs; the package servers being down (2026-11-11, 14-16 UTC:
          # three sweeps lost at this step) needn't stop the sweep while it's there.
          google-chrome --version || npx playwright install --with-deps chrome

      - name: Tests
        run: npm --prefix scraper test

      # Flight-check searches, reused for a few hours across runs (build-trips.js --search-cache).
      # Restored before the VPN is up: over it, 2026-11-11 22:05, the 62 MB download stalled at 54%
      # and timed out, and the build ran with no searches (212 board rows of 2,125).
      - name: Restore search cache
        id: searches
        uses: actions/cache/restore@v4
        with:
          path: .search-cache.json.gz
          key: searches-${{ github.run_id }}
          restore-keys: searches-
      - name: Restore search cache (again)
        id: searches2
        if: steps.searches.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v4
        with:
          path: .search-cache.json.gz
          key: searches-${{ github.run_id }}
          restore-keys: searches-
      # The booking pages to check beside the next scrape (build-trips.js --booking-queue).
      - name: Restore booking queue
        uses: actions/cache/restore@v4
        with:
          path: .booking-queue.json
          key: booking-queue-${{ github.run_id }}
          restore-keys: booking-queue-

      - name: VPN up
        id: vpn
        env:
          WG_CONF: ${{ secrets.PROTONVPN_WG_CONF }}
        run: scripts/vpn_up.sh

      - name: Scrape
        env:
          EGRESS: ${{ steps.vpn.outputs.vpn_ok == 'true' && 'vpn' || 'direct' }}
        run: |
          echo "BUILD_DEADLINE=$(( $(date +%s) + 49 * 60 ))" >> "$GITHUB_ENV"  # this step starts ~1 min in: leaves ~8 min to commit, push, alert
          export SCRAPE_UNTIL=$(( $(date +%s) + 26 * 60 ))  # the scrape budget ends here even if it starts late
          args=()
          [[ -n "${{ inputs.routes }}" ]] && args+=(--routes "${{ inputs.routes }}")
          # Flight checks beside the scrape (on the fares as they were), into the search cache the
          # build reads: done ~1 min before the scrape's ~26 (searches in flight run ~4.5 min on).
          scripts/run_sweep.sh snapshot
          WARM_UNTIL=$(( $(date +%s) + 20 * 60 )) scripts/run_sweep.sh warm > warm.log 2>&1 &
          warm=$!
          rc=0
          scripts/run_sweep.sh scrape "${args[@]}" 2>&1 | tee sweep.log || rc=$?
          wait "$warm" || echo "checks beside the scrape failed (exit $?)"
          sed 's/^/[checks] /' warm.log | tee -a sweep.log | grep -E 'planned|details|beside|search|rror' || true
          exit "$rc"

      # Even after a failed scrape: trips from whatever fares are current.
      - name: Build trips
        if: ${{ !cancelled() && steps.vpn.outcome == 'success' }}
        run: scripts/run_sweep.sh build 2>&1 | tee -a sweep.log

      - name: Alerts
        if: ${{ !cancelled() && steps.vpn.outcome == 'success' }}
        env:
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
        run: scripts/run_sweep.sh alerts 2>&1 | tee -a sweep.log

      # A cache much smaller than one already saved isn't saved over it: a run that started without
      # the searches (a failed download, or a thin cache restored) would otherwise hand its few
      # hundred to every run after (2026-11-11 22:05 to 01:05: four thin boards in a row).
      - name: Search cache worth saving
        id: worth
        if: always() && hashFiles('.search-cache.json.gz') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mine=$(stat -c %s .search-cache.json.gz)
          best=$(gh cache list --key searches- --limit 20 --json sizeInBytes --jq '[.[].sizeInBytes] | max // 0') || best=0
          echo "this run's cache: $mine B, the largest saved: $best B"
          echo "ok=$([[ $mine -ge $(( best / 2 )) ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Save search cache
        if: always() && steps.worth.outputs.ok == 'true'
        uses: actions/cache/save@v4
        with:
          path: .search-cache.json.gz
          key: searches-${{ github.run_id }}

      - name: Save booking queue
        if: always() && hashFiles('.booking-queue.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .booking-queue.json
          key: booking-queue-${{ github.run_id }}

      - name: Summary
        if: always()
        run: |
          { echo '```'; grep -E '^(control|network|sweep |.*FAILED)' sweep.log || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
