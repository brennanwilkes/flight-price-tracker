<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- No viewport-fit=cover: in an installed iOS app it lays the page out under the clock, where iOS
       blurs and fades it (seen in ~/movie-server). Without it the page starts below the status bar. -->
  <meta name="theme-color" content="#16181d">
  <!-- Filled by scripts/stamp-pwa.mjs at deploy; app/pwa.js registers the worker only when stamped. -->
  <meta name="fl-build" content="__BUILD__">
  <title>Asia Fares</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="app/style.css">
  <script type="module" src="app/main.js"></script>
</head>
<body>
  <header>
    <select id="month" aria-label="Departure month"><option value="">All months</option></select>
    <select id="via" aria-label="Staying in"><option value="">Via any city</option></select>
    <div class="toggle" role="group" aria-label="Home airport">
      <button data-home="YVR" aria-pressed="true">YVR</button>
      <button data-home="YYJ" aria-pressed="false">YYJ</button>
    </div>
  </header>
  <main id="view"><p class="note">Loading…</p></main>
  <footer><p id="stamp"></p></footer>
  <nav class="tabs" aria-label="Sections">
    <a href="#" data-tab="board">Board</a>
    <a href="#history" data-tab="history">History</a>
    <a href="#health" data-tab="health">Health</a>
  </nav>
</body>
</html>
