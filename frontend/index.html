<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- The installed iOS app draws the page under the clock and fades whatever sits there. As in
       ~/movie-server: a solid sticky header padded by the inset + 14px takes the fade (style.css). -->
  <meta name="theme-color" content="#eeede8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1114" media="(prefers-color-scheme: dark)">
  <!-- Filled by scripts/stamp-pwa.mjs at deploy; app/pwa.js registers the worker only when stamped. -->
  <meta name="fl-build" content="__BUILD__">
  <title>Asia Fares</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="app/style.css">
  <script type="module" src="app/main.js"></script>
</head>
<body>
  <header>
    <select id="month" aria-label="Departure month"><option value="">All months</option></select>
    <select id="via" aria-label="Staying in"><option value="">Any city</option></select>
    <div class="toggle" role="group" aria-label="Home airport">
      <button data-home="YVR" aria-pressed="true">YVR</button>
      <button data-home="YYJ" aria-pressed="false">YYJ</button>
    </div>
  </header>
  <main id="view"><p class="note">Loading…</p></main>
  <nav class="tabs" aria-label="Sections">
    <a href="#" data-tab="board"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Board</a>
    <a href="#history" data-tab="history"><svg viewBox="0 0 24 24"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>History</a>
    <a href="#health" data-tab="health"><svg viewBox="0 0 24 24"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg>Health</a>
  </nav>
</body>
</html>
